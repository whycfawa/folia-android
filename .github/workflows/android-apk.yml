# 当前文件：android-apk.yml
# 在云端构建 Folia for Android 的调试 APK，产物挂在 Actions 的 artifact 里。
#
# 触发：手动（workflow_dispatch）、推送到 perf/** 分支、打 v* 标签。
# 不做的事：不签名发布版、不创建 Release —— 这里只产出可直接安装的 debug APK。

name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'perf/**'
    tags:
      - 'v*'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests for the changed helper
        run: npx vitest run -c vitest.config.ts test/unit/utils/renderPixelRatio.test.ts

      - name: Build web bundle for Capacitor
        run: npm run build:capacitor

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # 仓库里的 wrapper 指向腾讯云镜像（作者本机用），GitHub 的 runner 上换成官方地址。
      - name: Point Gradle wrapper at the official distribution
        run: |
          sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https\\://services.gradle.org/distributions/#g' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
