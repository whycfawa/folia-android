# 当前文件：android-apk.yml
# 在云端构建 Folia for Android 的调试 APK，产物挂在 Actions 的 artifact 里。
#
# 触发：手动（workflow_dispatch）、推送到 perf/** 分支、打 v* 标签。
# 不做的事：不签名发布版、不创建 Release —— 这里只产出可直接安装的 debug APK。

name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'perf/**'
    tags:
      - 'v*'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库里的 package-lock.json 与 package.json 不同步（缺 @capacitor/* 8.6.0 等条目），
      # npm ci 会直接 EUSAGE 退出；和作者本机一致，用 npm install。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests for the changed helper
        run: npx vitest run -c vitest.config.ts test/unit/utils/renderPixelRatio.test.ts

      - name: Build web bundle for Capacitor
        run: npm run build:capacitor

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # 仓库里的 wrapper 指向腾讯云镜像（作者本机用），GitHub 的 runner 上换成官方地址。
      - name: Point Gradle wrapper at the official distribution
        run: |
          sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https\\://services.gradle.org/distributions/#g' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      # 固定测试签名：优先用仓库里的 android/keystore/folia-perf.jks；
      # 没有文件但有 FOLIA_TEST_KEYSTORE_BASE64 这个 secret 时，在构建机上还原。
      # 两者都没有就退回默认 debug 密钥——那样的包不能覆盖安装上一次的包。
      - name: Materialize test signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.FOLIA_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -f android/keystore/folia-perf.jks ]; then
            echo "使用仓库内的固定测试签名"
          elif [ -n "${TEST_KEYSTORE_BASE64:-}" ]; then
            mkdir -p android/keystore
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 -d > android/keystore/folia-perf.jks
            echo "已从 secret 还原固定测试签名"
          else
            echo "::warning::没有固定测试签名文件，本次用默认 debug 密钥，无法覆盖安装上一次的包"
          fi

      # gradle.properties 里作者写死了本机 Windows 的 JDK 路径（org.gradle.java.home），
      # 在 Linux runner 上无效；命令行 -D 的系统属性优先于 gradle.properties。
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/debug/

      # 把签名证书指纹打进日志：连续两次构建的 SHA-256 相同，才说明可以覆盖安装。
      - name: Print signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256) digest" || true
          else
            echo "apksigner 未找到，跳过指纹输出"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-perf-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
